[package]
name = "rayzor-runtime"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib", "staticlib"]

[dependencies]
inventory = "0.3"
rayzor-plugin = { path = "../plugin" }
lazy_static = "1.4"
libc = "0.2"
chrono = "0.4"
log = "0.4"
parking_lot = "0.12"
regex = "1"
backtrace = "0.3"
flate2 = "1"
# Half-precision floats (IEEE f16 + brain float bf16). Phase 3b uses
# this for CPU storage conversions; Phase 3c lowers selectively to NEON
# vcvt on aarch64.
half = "2"
rustls = "0.23"
webpki-roots = "0.26"
rustls-pemfile = "2"
ariadne = "0.4"

[build-dependencies]
cc = { version = "1", optional = true }

[features]
default = []
runtime-safety-checks = []
panic-on-safety-violation = []
tcc-runtime = ["cc"]
# Enables the TrackingAllocator + SIGPROF CPU profiler in
# runtime/src/lib.rs. Off by default — it adds ~5 atomic ops per alloc
# and an extra signal handler. The binary crate must wire
# `#[global_allocator] static GLOBAL: TrackingAllocator = ...` and call
# `ensure_alloc_dump_hooks()` from main. Activate via env vars at
# runtime: RAYZOR_DUMP_ALLOC_AT_EXIT / RAYZOR_ALLOC_GRAPH /
# RAYZOR_CPU_PROFILE. See memory/project_debugger_feasibility.md.
profile = []

[profile.release]
opt-level = 3
lto = true
