[workspace]
members = [
    "parser",
    "compiler",
    "compiler/bsym",
    "diagnostics",
    "source_map",
    "runtime",
    "runtime-core",
    "gpu",
    "window",
    "lsp",
    "plugin",
    "nue-plugins",
    "rayzor-tensors",
    "wasm-opt-helper",
    "snapshot-gen"
]
# runtime-wasm is excluded from workspace — built separately for wasm32-wasip1
exclude = [
    "cranelift-fork",
    "ci/macro-e2e",
    "runtime-wasm"
]

[package]
name = "rayzor"
version = "0.1.0"
edition = "2021"

[features]
# LLVM backend ON by default: the LLVM tier (auto-upgrade after main entry)
# must be available without an opt-in flag. LLVM 21 is a required toolchain
# dependency, not optional. `--no-default-features` still gives a Cranelift-only build.
default = ["llvm-backend"]
llvm-backend = ["compiler/llvm-backend"]
# Opt-in: link LLVM dynamically (for distros missing libPolly.a, e.g. apt
# llvm-<v>-dev on Debian/Ubuntu). `cargo build --features llvm-dynamic`.
llvm-dynamic = ["compiler/llvm-dynamic"]
# Heap + CPU profiler. Off by default; see rayzor-runtime's `profile`
# feature for details. Activate with `cargo build --release --features profile`
# then use RAYZOR_DUMP_ALLOC_AT_EXIT / RAYZOR_ALLOC_GRAPH / RAYZOR_CPU_PROFILE.
profile = ["rayzor-runtime/profile"]

[dependencies]
parser = { path = "parser" }
compiler = { path = "compiler" }
diagnostics = { path = "diagnostics" }
rayzor-runtime = { path = "runtime" }
clap = { version = "4.5", features = ["derive"] }
libloading = "0.8"
rayzor-plugin = { path = "plugin" }
ratatui = "0.29"
crossterm = "0.28"
postcard = { version = "1.0", features = ["alloc"] }
rayzor-lsp = { path = "lsp" }
anyhow = "1"
walkdir = "2"
libc = "0.2"
# Binaryen wasm-opt post-pass (default-on): coalesces the per-SSA-value
# local.set/local.get round-trips the wasm_backend emits (wasmtime does not
# fully coalesce them) — a verified ~3x bit-exact speedup on the Q4 kernel.
#
# The bundled `wasm-opt = "0.116"` crate is deliberately NOT a dependency of
# THIS bin — it compiles Binaryen into the binary, and Binaryen exports ~1890
# `llvm::` ADT symbols (incl. llvm::SmallVectorBase::grow_pod) that ODR-collide
# with LLVM 21 (llvm-sys 211) and corrupt the LLVM JIT/AOT backend (6GB-alloc
# SIGSEGV in Module::print). Instead, the workspace member `wasm-opt-helper`
# links Binaryen as a SEPARATE binary `rayzor-wasm-opt`; src/wasm_cmd.rs spawns
# it as a subprocess (resolution: RAYZOR_WASM_OPT_BIN → `rayzor-wasm-opt` next
# to the rayzor exe → `rayzor-wasm-opt`/`wasm-opt` on PATH; falls back to the
# unoptimized module if none is found). Ship both binaries side-by-side.

# Workspace release profile. `lto = "thin"` enables cross-crate inlining so
# `rayzor-runtime` hot-path callsites continue to inline through the per-arch
# SIMD primitives now hosted in `rayzor-runtime-core`. Without this, the
# function-call boundary across crates costs ~8% on Llama 3.2 1B Q4_K_M
# decode. Thin LTO adds ~20% to release build time; full LTO would be cleaner
# but adds another ~30%. The existing [profile.release] blocks inside per-crate
# Cargo.toml files are silently ignored by cargo (see the workspace warning);
# this is the only place release-profile changes take effect.
[profile.release]
opt-level = 3
lto = "thin"

# Compiler crate stays at opt-level=2: workaround for an LLVM optimizer bug
# that causes infinite loops in release builds when lowering TAST expressions.
[profile.release.package.compiler]
opt-level = 2

# NOTE: the wasm-opt-helper crate links Binaryen (a large vendored C++ codebase)
# and inherits the workspace `lto = "thin"`. There's nothing to cross-inline for
# a standalone subprocess binary, so the LTO is wasted build time — but cargo
# does NOT allow `lto` in a per-`package` profile override (only at profile
# level), so we can't disable it just for this crate. It's a rare rebuild
# (Binaryen is cached after the first compile), so we leave it.

# Cranelift 0.133.0 isn't on crates.io yet — sourced from upstream
# bytecodealliance/wasmtime `release-46.0.0` (the macOS cranelift-object
# fix is merged upstream; this branch carries the 0.133 codegen that
# rayzor's native backend targets). wasmtime + wasmtime-wasi are pinned
# to the SAME branch in compiler/Cargo.toml so wasmtime-cranelift uses
# this exact cranelift — otherwise the resolver drops the JIT compiler
# and wasmtime silently falls back to the Pulley interpreter (~50x
# slower). Drop this block once 0.133 lands on crates.io.
[patch.crates-io]
cranelift = { git = "https://github.com/bytecodealliance/wasmtime", rev = "60154144" }
cranelift-codegen = { git = "https://github.com/bytecodealliance/wasmtime", rev = "60154144" }
cranelift-frontend = { git = "https://github.com/bytecodealliance/wasmtime", rev = "60154144" }
cranelift-module = { git = "https://github.com/bytecodealliance/wasmtime", rev = "60154144" }
cranelift-jit = { git = "https://github.com/bytecodealliance/wasmtime", rev = "60154144" }
cranelift-native = { git = "https://github.com/bytecodealliance/wasmtime", rev = "60154144" }
cranelift-object = { git = "https://github.com/bytecodealliance/wasmtime", rev = "60154144" }

# inkwell 0.7.1 still calls LLVMConstMul and its NSW/NUW variants, which LLVM 21
# removed. Nothing here references those methods, so a normal build never links
# them — but a test binary pulls in the object file that contains them and the
# link fails on an undefined symbol. Thin LTO lets the optimizer drop the dead
# code before the linker looks for it.
[profile.test]
lto = "thin"
