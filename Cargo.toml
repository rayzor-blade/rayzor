[workspace]
members = [
    "parser",
    "compiler",
    "diagnostics",
    "source_map",
    "runtime",
    "gpu",
    "window",
    "lsp",
    "plugin"
]
# runtime-wasm is excluded from workspace — built separately for wasm32-wasip1
exclude = [
    "cranelift-fork",
    "ci/macro-e2e",
    "runtime-wasm"
]

[package]
name = "rayzor"
version = "0.1.0"
edition = "2021"

[features]
llvm-backend = ["compiler/llvm-backend"]
# Heap + CPU profiler. Off by default; see rayzor-runtime's `profile`
# feature for details. Activate with `cargo build --release --features profile`
# then use RAYZOR_DUMP_ALLOC_AT_EXIT / RAYZOR_ALLOC_GRAPH / RAYZOR_CPU_PROFILE.
profile = ["rayzor-runtime/profile"]

[dependencies]
parser = { path = "parser" }
compiler = { path = "compiler" }
diagnostics = { path = "diagnostics" }
rayzor-runtime = { path = "runtime" }
clap = { version = "4.5", features = ["derive"] }
libloading = "0.8"
ratatui = "0.29"
crossterm = "0.28"
postcard = { version = "1.0", features = ["alloc"] }
rayzor-lsp = { path = "lsp" }

# Workaround for LLVM optimizer bug that causes infinite loops in release builds
# when lowering TAST expressions. Using opt-level=2 instead of 3 prevents the bug.
[profile.release.package.compiler]
opt-level = 2

# Cranelift 0.133.0 isn't on crates.io yet — sourced from the
# `fix/cranelift-object-darwin-platform` branch of darmie/wasmtime
# (carries the macOS-platform fix needed by cranelift-object alongside
# the 0.133 codegen). Replace crates-io entries the resolver picks up
# via the `0.133` constraint in compiler/Cargo.toml. Once a tagged
# 0.133 release lands on crates.io, drop this block.
[patch.crates-io]
cranelift = { git = "https://github.com/darmie/wasmtime", branch = "fix/cranelift-object-darwin-platform" }
cranelift-codegen = { git = "https://github.com/darmie/wasmtime", branch = "fix/cranelift-object-darwin-platform" }
cranelift-frontend = { git = "https://github.com/darmie/wasmtime", branch = "fix/cranelift-object-darwin-platform" }
cranelift-module = { git = "https://github.com/darmie/wasmtime", branch = "fix/cranelift-object-darwin-platform" }
cranelift-jit = { git = "https://github.com/darmie/wasmtime", branch = "fix/cranelift-object-darwin-platform" }
cranelift-native = { git = "https://github.com/darmie/wasmtime", branch = "fix/cranelift-object-darwin-platform" }
cranelift-object = { git = "https://github.com/darmie/wasmtime", branch = "fix/cranelift-object-darwin-platform" }
