[workspace]
members = [
    "parser",
    "compiler",
    "diagnostics",
    "source_map",
    "runtime",
    "gpu",
    "numa",
    "window",
    "lsp",
    "plugin"
]
# runtime-wasm is excluded from workspace — built separately for wasm32-wasip1
exclude = [
    "cranelift-fork",
    "ci/macro-e2e",
    "runtime-wasm"
]

[package]
name = "rayzor"
version = "0.1.0"
edition = "2021"

[features]
llvm-backend = ["compiler/llvm-backend"]

[dependencies]
parser = { path = "parser" }
compiler = { path = "compiler" }
diagnostics = { path = "diagnostics" }
rayzor-runtime = { path = "runtime" }
clap = { version = "4.5", features = ["derive"] }
libloading = "0.8"
ratatui = "0.29"
crossterm = "0.28"
postcard = { version = "1.0", features = ["alloc"] }
rayzor-lsp = { path = "lsp" }

# Workaround for LLVM optimizer bug that causes infinite loops in release builds
# when lowering TAST expressions. Using opt-level=2 instead of 3 prevents the bug.
[profile.release.package.compiler]
opt-level = 2

# Cranelift 0.133.0 isn't on crates.io yet — sourced from the
# darmie/wasmtime fork. Replace crates-io entries the resolver picks
# up via the `0.133` constraint in compiler/Cargo.toml. Once a
# tagged 0.133 release lands on crates.io, drop this block.
[patch.crates-io]
cranelift = { git = "https://github.com/darmie/wasmtime" }
cranelift-codegen = { git = "https://github.com/darmie/wasmtime" }
cranelift-frontend = { git = "https://github.com/darmie/wasmtime" }
cranelift-module = { git = "https://github.com/darmie/wasmtime" }
cranelift-jit = { git = "https://github.com/darmie/wasmtime" }
cranelift-native = { git = "https://github.com/darmie/wasmtime" }
cranelift-object = { git = "https://github.com/darmie/wasmtime" }
