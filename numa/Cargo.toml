[package]
name = "rayzor-numa"
version = "0.1.0"
edition = "2021"
description = "NUMA topology + thread affinity for Rayzor (Linux real; macOS/Windows/wasm fall back to single-node soft affinity)."

[lib]
# rlib for the static-link path (runtime depends on this directly).
# cdylib so the crate can also be loaded as a `.rpkg` plugin in future
# (matches the rayzor-gpu pattern; not exercised today but cheap to keep).
crate-type = ["cdylib", "rlib"]

[dependencies]
rayzor-plugin = { path = "../plugin" }

# Linux: parse /sys/devices/system/node/ and use libc::pthread_setaffinity_np.
# Other platforms get small platform-specific impls that don't need libc.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

# macOS: thread_policy_set via mach2. Soft affinity only — Apple doesn't expose
# NUMA topology to userland, so we report a single node and route bind calls
# to thread_policy_set with THREAD_AFFINITY_TAG_NULL (a no-op tag).
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

# Windows: GetNumaHighestNodeNumber + SetThreadGroupAffinity via the winapi crate.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_Foundation",
] }
