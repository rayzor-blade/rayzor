name: Examples

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  LLVM_SYS_211_PREFIX: /usr/lib/llvm-21

jobs:
  examples:
    name: Compiler Examples
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install LLVM 21
        run: bash .github/scripts/install-llvm.sh

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Core Types E2E
        # RAYZOR_JIT_RELOC_DEBUG records how far the JIT's code lands from the
        # symbols it calls. A call between JIT allocations is a signed 32-bit
        # displacement that cranelift-jit aborts on rather than veneering on
        # x86-64, and this step fails that way intermittently — the distance is
        # whatever mmap returns, so it has to be captured from a real run.
        env:
          RAYZOR_JIT_RELOC_DEBUG: 1
        run: cargo run --release --package compiler --features all-backends --example test_core_types_e2e

      - name: sys.thread stdlib
        run: cargo run --release --package compiler --features all-backends --example test_sys_thread

      - name: Rayzor stdlib E2E
        run: cargo run --release --package compiler --features all-backends --example test_rayzor_stdlib_e2e

      - name: Haxe stdlib
        run: cargo run --release --package compiler --features all-backends --example test_haxe_stdlib
