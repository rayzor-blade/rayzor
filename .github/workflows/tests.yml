name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Clippy & Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install LLVM 21
        run: bash .github/scripts/install-llvm.sh

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      # Most lints here are cfg-gated, so linting one architecture cannot see
      # the others. Linux is the gate; check a second target before assuming a
      # clean local run means anything.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Both release shapes have to keep resolving. The default links the
      # system libLLVM; the tarball built by packages.yml links LLVM's
      # component archives so a plain download needs no LLVM installed. Only
      # the packaging job links either one, and it runs on tags — checking
      # both here catches a broken feature set on the pull request instead.
      - name: Both LLVM link shapes resolve
        run: |
          cargo check -p rayzor --bin rayzor
          cargo check -p rayzor --bin rayzor --no-default-features --features llvm-static

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            toolchain: stable
            compiler_features: ""
          - os: macos-latest
            toolchain: stable
            compiler_features: ""
          # Cranelift only. llvm-sys drives `llvm-config` and links the
          # component archives, and the official LLVM release for Windows is
          # built toolchain-only: it ships neither, so no value of
          # LLVM_SYS_211_PREFIX can satisfy it. Restoring the LLVM tier here
          # needs a distribution that carries the development files — the
          # conda-forge `llvmdev` package, or MSYS2 with the gnu toolchain.
          - os: windows-latest
            toolchain: stable
            compiler_features: "--no-default-features --features cranelift-backend"
    steps:
      - uses: actions/checkout@v5

      - name: Install LLVM 21 (Linux)
        if: runner.os == 'Linux'
        run: bash .github/scripts/install-llvm.sh

      - name: Install LLVM 21 (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm@21
          echo "LLVM_SYS_211_PREFIX=$(brew --prefix llvm@21)" >> "$GITHUB_ENV"


      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}

      - uses: Swatinem/rust-cache@v2

      - name: Parser lib tests
        run: cargo test -p parser --lib

      - name: Parser integration tests
        run: cargo test -p parser --tests

      - name: Runtime lib tests
        run: cargo test -p rayzor-runtime --lib

      - name: Compiler lib tests
        run: cargo test -p compiler --lib ${{ matrix.compiler_features }} -- --skip "type_arena"

      - name: Compiler integration tests
        run: cargo test -p compiler --tests ${{ matrix.compiler_features }}

      # The server links the compiler with its default LLVM tier, which the
      # Windows runner cannot build (see the matrix above).
      - name: Language server tests
        if: matrix.os != 'windows-latest'
        run: cargo test -p rayzor-lsp

      - name: Diagnostics tests
        run: cargo test -p diagnostics

      - name: Source map tests
        run: cargo test -p source_map
