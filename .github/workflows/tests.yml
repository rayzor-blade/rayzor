name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Clippy & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 21
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          sudo add-apt-repository -y "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-21 main"
          sudo apt-get update
          sudo apt-get install -y llvm-21 llvm-21-dev libpolly-21-dev
          echo "LLVM_SYS_211_PREFIX=/usr/lib/llvm-21" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      # Most lints here are cfg-gated, so linting one architecture cannot see
      # the others. Linux is the gate; check a second target before assuming a
      # clean local run means anything.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            toolchain: stable
          # runtime-core gates the NEON dotprod intrinsics behind
          # `feature(stdarch_neon_dotprod)`, still unstable in 1.97, and the
          # macOS runners are arm64 — so this target needs nightly to build at
          # all. Drop back to stable once vdotq_s32 and friends land.
          - os: macos-latest
            toolchain: nightly
          - os: windows-latest
            toolchain: stable
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 21 (Linux)
        if: runner.os == 'Linux'
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          sudo add-apt-repository -y "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-21 main"
          sudo apt-get update
          sudo apt-get install -y llvm-21 llvm-21-dev libpolly-21-dev
          echo "LLVM_SYS_211_PREFIX=/usr/lib/llvm-21" >> "$GITHUB_ENV"

      - name: Install LLVM 21 (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm@21
          echo "LLVM_SYS_211_PREFIX=$(brew --prefix llvm@21)" >> "$GITHUB_ENV"

      - name: Install LLVM 21 (Windows)
        if: runner.os == 'Windows'
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "21"
          env: true
          directory: ${{ runner.temp }}/llvm

      - name: Point llvm-sys at it (Windows)
        if: runner.os == 'Windows'
        run: echo "LLVM_SYS_211_PREFIX=${{ runner.temp }}/llvm" >> $env:GITHUB_ENV

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}

      - uses: Swatinem/rust-cache@v2

      - name: Parser lib tests
        run: cargo test -p parser --lib

      - name: Parser integration tests
        run: cargo test -p parser --tests

      - name: Runtime lib tests
        run: cargo test -p rayzor-runtime --lib

      - name: Compiler lib tests
        run: cargo test -p compiler --lib -- --skip "type_arena"

      - name: Compiler integration tests
        run: cargo test -p compiler --tests

      - name: Diagnostics tests
        run: cargo test -p diagnostics

      - name: Source map tests
        run: cargo test -p source_map
