name: Nightly

# Rolling prerelease of the compiler, so `install.sh` has something to fetch.
# The download is self-contained: LLVM's C++ ABI does not hold across major
# versions, so a plain download cannot assume a version-matched libLLVM is
# installed and links LLVM's component archives instead. That is ~223 MB
# against ~51 MB for the system-linked build -- a trade that belongs to a
# package manager's build, not to this one.

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macos-aarch64
            asset: rayzor-macos-aarch64.tar.gz
            features: "--no-default-features --features llvm-static"
            wasm_opt: true
          # Cross-compiled from arm64: GitHub retired the Intel macOS runners,
          # so `macos-13` never gets a machine and the job queues forever.
          # Homebrew's llvm@21 there is arm64, so the x86_64 LLVM comes from
          # conda-forge's llvmdev instead -- the build carries the same tier as
          # every other target.
          - os: macos-14
            label: macos-x86_64
            asset: rayzor-macos-x86_64.tar.gz
            target: x86_64-apple-darwin
            llvmdev: osx-64/llvmdev-21.1.8-h36529c3_1.conda
            features: "--no-default-features --features llvm-static"
            wasm_opt: false
          - os: ubuntu-latest
            label: linux-x86_64
            asset: rayzor-linux-x86_64.tar.gz
            features: "--no-default-features --features llvm-static"
            wasm_opt: true
          # LLVM.org's Windows release is toolchain-only and carries no
          # llvm-config or component archives, which is what llvm-sys links
          # against -- but conda-forge's `llvmdev` package carries both. The
          # against -- conda-forge's llvmdev carries both.
          - os: windows-latest
            label: windows-x86_64
            asset: rayzor-windows-x86_64.zip
            features: "--no-default-features --features llvm-static"
            wasm_opt: false
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 21 (Linux)
        if: runner.os == 'Linux'
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          sudo add-apt-repository -y "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-21 main"
          sudo apt-get update
          sudo apt-get install -y llvm-21 llvm-21-dev libpolly-21-dev
          echo "LLVM_SYS_211_PREFIX=/usr/lib/llvm-21" >> "$GITHUB_ENV"

      - name: Install LLVM 21 (macOS)
        if: runner.os == 'macOS' && matrix.llvmdev == ''
        run: |
          brew install llvm@21
          echo "LLVM_SYS_211_PREFIX=$(brew --prefix llvm@21)" >> "$GITHUB_ENV"

      # The LLVM for a target the runner is not. Homebrew only has the host's
      # architecture, so a cross build takes its LLVM from conda-forge, which
      # publishes the development files for every platform we build.
      - name: Install cross LLVM 21 (${{ matrix.llvmdev }})
        if: matrix.llvmdev != ''
        run: |
          curl -fsSL -o llvmdev.conda \
            "https://anaconda.org/conda-forge/llvmdev/21.1.8/download/${{ matrix.llvmdev }}"
          mkdir -p llvmdev && cd llvmdev
          # A .conda is a zip of zstd tarballs; pkg-* carries the files.
          unzip -q ../llvmdev.conda
          tar -xf pkg-*.tar.zst
          cd ..
          PREFIX="$PWD/llvmdev"
          test -x "$PREFIX/bin/llvm-config"
          "$PREFIX/bin/llvm-config" --version
          echo "LLVM_SYS_211_PREFIX=$PREFIX" >> "$GITHUB_ENV"

      # The development files LLVM.org's Windows installer leaves out.
      # INSTALLED, not unzipped: a conda package carries its build-time prefix
      # (`C:/bld/llvm-package_*/work/build`) inside llvm-config.exe, and conda
      # rewrites that on install. Unpacking the tarball by hand skips the
      # rewrite, so llvm-config reports a libdir that does not exist and the
      # link fails with the archives sitting right there.
      - name: Install LLVM 21 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "Downloading Micromamba..."
          curl.exe -fsSL -o micromamba.tar.bz2 `
            https://micro.mamba.pm/api/micromamba/win-64/latest
          
          Write-Host "Extracting Micromamba using 7-Zip..."
          # 7z extracts the .bz2 to a .tar, then un-tars it into the 'mm' directory
          7z x micromamba.tar.bz2 -y | Out-Null
          7z x micromamba.tar -omm -y | Out-Null
          
          $mm = Join-Path (Resolve-Path mm).Path 'Library\bin\micromamba.exe'
          Write-Host "Found micromamba at $mm"
          
          Write-Host "Creating environment (this may take a few minutes)..."
          # --log-level=info forces sequential text logs instead of UI spinners
          & $mm create -y -p "$PWD\llvmenv" -c conda-forge --log-level=info `
            "llvmdev=21.1.8" "zlib" "libxml2-devel"

          # In PowerShell, native executables failing don't inherently fail the step
          if ($LASTEXITCODE -ne 0) {
            throw "Micromamba failed with exit code $LASTEXITCODE"
          }

          $prefix = "$PWD\llvmenv\Library"
          if (-not (Test-Path "$prefix\bin\llvm-config.exe")) {
            throw "llvmdev installed no llvm-config.exe under $prefix\bin"
          }
          
          # Prove the reported paths point at THIS install, not the build box.
          $libdir = & "$prefix\bin\llvm-config.exe" --libdir
          Write-Host "llvm-config --libdir = $libdir"
          if (-not (Test-Path $libdir)) {
            throw "llvm-config reports a libdir that does not exist: $libdir"
          }
          & "$prefix\bin\llvm-config.exe" --version

          # llvm-config names its system libraries by the file names LLVM was
          # BUILT against, and conda-forge has since renamed zstd's import
          # library. Alias it rather than pinning an old zstd, so a version
          # bump cannot quietly take the link out again.
          if ((Test-Path "$libdir\zstd.lib") -and
              -not (Test-Path "$libdir\zstd.dll.lib")) {
            Copy-Item "$libdir\zstd.lib" "$libdir\zstd.dll.lib"
          }

          # Check every library the linker will be told to open, here rather
          # than ten minutes later at link time, where it surfaces as a bare
          # LNK1181 naming only the first one missing. The Windows SDK supplies
          # its own, so those are not this environment's to provide.
          $sdk = @('psapi.lib','shell32.lib','ole32.lib','uuid.lib',
                   'advapi32.lib','ws2_32.lib','ntdll.lib','kernel32.lib',
                   'user32.lib','userenv.lib','dbghelp.lib','delayimp.lib',
                   'legacy_stdio_definitions.lib')
          $missing = @()
          foreach ($lib in (& "$prefix\bin\llvm-config.exe" `
                              --system-libs --link-static).Split(' ')) {
            $lib = $lib.Trim()
            if (-not $lib -or $sdk -contains $lib.ToLower()) { continue }
            if (-not (Test-Path (Join-Path $libdir $lib))) { $missing += $lib }
          }
          if ($missing.Count) {
            throw "llvm-config names system libraries this env does not provide: $($missing -join ', ')"
          }
          Write-Host "all llvm-config --system-libs resolve under $libdir"
          "LLVM_SYS_211_PREFIX=$prefix" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The lowered standard library the shipped binary carries, and the build
      # script embeds it -- so it has to exist before the binary is built, or
      # a user's first compile pays to lower the library from source.
      - name: Generate the standard library snapshot
        run: cargo run --release -p snapshot-gen

      - name: Add the cross target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}

      - name: Build rayzor
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          FEATURES="${{ matrix.features }}"
          [ -n "${TARGET:-}" ] && FEATURES="$FEATURES --target $TARGET"
          cargo build -p rayzor --release $FEATURES

      # LLVM pulls zlib, zstd and libxml2 in through IMPORT libraries, so those
      # DLLs have to sit beside the exe: Windows searches the executable's own
      # directory first, and without them the process cannot start at all --
      # which surfaces as a bare exit 127 with no output, not a missing-DLL
      # message. Copying them here also makes the published archive standalone
      # rather than dependent on a conda env being on PATH.
      - name: Bundle the runtime DLLs the binary links against (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $envBin = "$PWD\llvmenv\Library\bin"
          $needed = @('zlib.dll', 'zstd.dll', 'libxml2.dll')
          $missing = @()
          foreach ($dll in $needed) {
            $src = Join-Path $envBin $dll
            if (Test-Path $src) {
              Copy-Item $src target\release\ -Force
              Write-Host "bundled $dll"
            } else {
              $missing += $dll
            }
          }
          if ($missing.Count) {
            Write-Host "--- $envBin ---"
            Get-ChildItem $envBin -Filter *.dll | ForEach-Object { Write-Host "  $($_.Name)" }
            throw "the env provides no $($missing -join ', ') to sit beside the binary"
          }

      # Bundled wasm optimizer, kept a SEPARATE binary so Binaryen's llvm::
      # symbols cannot ODR-collide with LLVM in the main one. The CLI finds it
      # as a sibling of its own exe, so wasm optimization needs no external
      # binaryen install.
      - name: Build rayzor-wasm-opt helper
        if: matrix.wasm_opt
        run: cargo build -p rayzor-wasm-opt-helper --release

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          OUT=target/release
          [ -n "${{ matrix.target }}" ] && OUT=target/${{ matrix.target }}/release
          cp "$OUT/rayzor" dist/
          [ -f "$OUT/rayzor-wasm-opt" ] && cp "$OUT/rayzor-wasm-opt" dist/ || true
          chmod +x dist/*
          tar -czf "${{ matrix.asset }}" -C dist .
          shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/rayzor.exe dist/
          Copy-Item target/release/*.dll dist/ -Force
          Compress-Archive -Path dist/* -DestinationPath "${{ matrix.asset }}" -Force
          (Get-FileHash "${{ matrix.asset }}" -Algorithm SHA256).Hash.ToLower() + "  ${{ matrix.asset }}" `
            | Out-File -Encoding ascii "${{ matrix.asset }}.sha256"

      # Only where the binary can actually run: a cross-compiled x86_64
      # build cannot be executed on the arm64 runner that produced it.
      - name: Smoke-test the binary it just built
        if: matrix.target == ''
        shell: bash
        run: |
          BIN=target/release/rayzor
          [ "${{ runner.os }}" = "Windows" ] && BIN=target/release/rayzor.exe
          "$BIN" --version
          printf 'class Main { public static function main() { Sys.println("nightly ok"); } }\n' > /tmp/Main.hx
          "$BIN" run /tmp/Main.hx | tee /tmp/out.txt
          grep -q "nightly ok" /tmp/out.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256

  publish:
    name: Publish nightly
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.sha256' \) \
            -exec cp {} release/ \;
          ls -la release
          # A publish with nothing in it would replace a working nightly with
          # an empty one, which is worse than not publishing.
          test -n "$(ls -A release)"

      # One rolling tag. `install.sh` fetches from a stable URL rather than
      # having to discover the newest release first.
      - name: Publish rolling nightly
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly
          prerelease: true
          body: |
            Rolling development build from `main` (${{ github.sha }}).
            Rebuilt on every scheduled run — not a stable release.

            Install: `curl -fsSL https://rayzor.tech/install.sh | bash`

            Every target carries the LLVM tier. On Windows, WSL remains the
            smoother path -- `install.sh` installs the Linux build there.
          files: release/*
          fail_on_unmatched_files: true
