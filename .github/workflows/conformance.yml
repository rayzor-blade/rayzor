name: Conformance

# Scores rayzor against the official HaxeFoundation/haxe regression corpus and
# publishes the fraction that runs. This is a correctness measure and belongs
# nowhere near the 199-test suite's number: that one counts crashes and
# regressions, since only a fraction of its files self-check, so progress here
# would read as regression there.

on:
  push:
    branches: [main]
    paths:
      - 'compiler/**'
      - 'runtime/**'
      - 'haxe-conformance/**'
      - '.github/workflows/conformance.yml'
  pull_request:
    branches: [main]
    paths:
      - 'compiler/**'
      - 'runtime/**'
      - 'haxe-conformance/**'
      - '.github/workflows/conformance.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  LLVM_SYS_211_PREFIX: /usr/lib/llvm-21

permissions:
  contents: read

# Queue, never cancel. This is a measurement, not a gate: a run killed by the
# next push produces no number at all, and during active development the next
# push always arrives before a run finishes -- every run so far was cancelled
# and the badge never published once. Benchmarks queue for the same reason.
concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  conformance:
    name: Haxe conformance
    runs-on: ubuntu-latest
    # Generous, because a runner is far slower at this than a laptop: the
    # corpus is ~5 minutes locally and overran 45 here. Still bounded, since
    # the default six hours would sit on a runner that long before saying so.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 21
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          sudo add-apt-repository -y "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-21 main"
          sudo apt-get update
          sudo apt-get install -y llvm-21 llvm-21-dev libpolly-21-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build rayzor-runtime static library
        run: cargo build --release -p rayzor-runtime

      # Before the CLI, which embeds it at build time -- generating it
      # afterwards would not reach the binary that runs the corpus.
      - name: Generate the standard library snapshot
        run: cargo run --release -p snapshot-gen

      - name: Build rayzor CLI
        run: cargo build --release --features llvm-backend

      - name: Record runner and LLVM environment
        run: |
          mkdir -p conformance-out
          {
            uname -a
            lscpu
            free -h
            # Whether a crash on this runner writes a core, and to where. A run
            # that reports CRASH=0 and ~240 TIMEOUTs is one where it did.
            echo "core_pattern: $(cat /proc/sys/kernel/core_pattern 2>/dev/null)"
            echo "core limit:   $(ulimit -c)"
            llvm-config-21 --version
            llvm-config-21 --libdir
            ldd ./target/release/rayzor
          } > conformance-out/environment.txt

      # Keyed on the pin, so a corpus bump is what invalidates it.
      - name: Cache the Haxe corpus
        uses: actions/cache@v4
        with:
          path: haxe-conformance/corpus
          key: haxe-corpus-${{ hashFiles('haxe-conformance/corpus.pin', 'haxe-conformance/fetch.sh') }}

      - name: Fetch the Haxe corpus
        run: ./haxe-conformance/fetch.sh

      # Never fails the build. The score is a measurement, and a measurement
      # that can go red creates pressure to skip tests rather than fix the
      # compiler. Regressions are visible in the number and the diffable TSV.
      - name: Run the corpus
        env:
          WORK: ${{ runner.temp }}/conformance
          OUT: ${{ runner.temp }}/conformance/report.tsv
          # Tighter than the local default. A test that cannot compile and run
          # in this long is stuck, and paying a minute each for those is what
          # turns a five-minute corpus into an overrun.
          TIMEOUT: 25
          # Include successful/failed LLVM promotion in each retained raw log.
          RAYZOR_PROFILE_LOAD: 1
          # A signal cannot return a Rust error. Record the last startup hook
          # entered/completed so CI-only promotion crashes still identify the
          # exact function and whether it was baseline or LLVM replay.
          RAYZOR_TIER_TRACE_STARTUP: 1
        # The score is a measurement. Letting the step's exit status fail the
        # job skipped the summary and the upload with it, so a run that died
        # partway produced no number AND no evidence of why.
        continue-on-error: true
        run: ./haxe-conformance/run.sh

      - name: Summarise
        if: always()
        env:
          WORK: ${{ runner.temp }}/conformance
          REPORT: ${{ runner.temp }}/conformance/report.tsv
        run: |
          mkdir -p conformance-out
          if [ ! -s "$REPORT" ]; then
            echo "no report written — the corpus step produced nothing" \
              >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          cp "$REPORT" conformance-out/
          if [ -d "$WORK/logs" ]; then
            cp -R "$WORK/logs" conformance-out/
          fi
          # Only a complete run may publish a score. The website takes its
          # badge from the newest SUCCESSFUL run, so summarising a truncated
          # report would publish a drop that reflects where the corpus stopped
          # rather than anything about the compiler. Keep the partial report as
          # an artifact and fail, so the badge holds at the last full run.
          if [ ! -f "$WORK/COMPLETE" ]; then
            rows=$(( $(wc -l < "$REPORT") - 1 ))
            echo "corpus stopped after $rows tests — not scoring a partial run" \
              >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          python3 haxe-conformance/summarise.py "$REPORT" conformance-out
          cat conformance-out/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-results
          path: conformance-out/
          retention-days: 90
