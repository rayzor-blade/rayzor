name: Benchmarks

on:
  push:
    branches: [main, explore/tinycc-tiered-aot]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  LLVM_SYS_211_PREFIX: /usr/lib/llvm-21

permissions:
  contents: read
  actions: read

concurrency:
  group: "benchmarks"
  cancel-in-progress: false

jobs:
  build:
    name: Build & Bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- Install LLVM 21 for Rayzor ---
      - name: Install LLVM 21
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          sudo add-apt-repository -y "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-21 main"
          sudo apt-get update
          sudo apt-get install -y llvm-21 llvm-21-dev libpolly-21-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build rayzor-runtime static library
        run: cargo build --release -p rayzor-runtime

      # The lowered standard library, built once here so no measured compile
      # pays to lower it. Generated before the binaries that use it: the CLI
      # embeds it at build time, so producing it afterwards would not reach the
      # binary that ships. The generator needs only the front end, which is a
      # different feature set from the CLI's and so compiles the compiler once
      # more — the cache carries that between runs.
      - name: Generate the standard library snapshot
        run: |
          mkdir -p target/release
          cargo run --release -p snapshot-gen -- target/release/stdlib_snapshot.bin
          ls -l target/release/stdlib_snapshot.bin

      - name: Build rayzor CLI
        env:
          RAYZOR_SNAPSHOT: target/release/stdlib_snapshot.bin
        run: cargo build --release --features llvm-backend

      # Built here so the kernel runners and `collect` only execute it. Their
      # cargo caches are keyed per job, so building it there costs a full
      # compiler rebuild on every kernel.
      - name: Build benchmark runner
        run: cargo build --release --package compiler --features all-backends --example benchmark_runner

      - name: Generate precompiled bundles and stdlib symbol cache
        run: |
          ./target/release/rayzor bundle compiler/benchmarks/src/deltablue.hx -o compiler/benchmarks/precompiled/deltablue.rzb --strip
          ./target/release/rayzor bundle compiler/benchmarks/src/fibonacci.hx -o compiler/benchmarks/precompiled/fibonacci.rzb --strip
          ./target/release/rayzor bundle compiler/benchmarks/src/mandelbrot.hx -o compiler/benchmarks/precompiled/mandelbrot.rzb --strip
          ./target/release/rayzor bundle compiler/benchmarks/src/nbody.hx -o compiler/benchmarks/precompiled/nbody.rzb --strip
          ./target/release/rayzor preblade --out .rayzor/blade/stdlib

      - name: Upload precompiled bundles and stdlib cache
        uses: actions/upload-artifact@v4
        with:
          name: precompiled-bundles
          path: |
            compiler/benchmarks/precompiled/*.rzb
            .rayzor/blade/stdlib/stdlib.bsym
          retention-days: 1

      - name: Upload rayzor binaries
        uses: actions/upload-artifact@v4
        with:
          name: rayzor-binaries
          path: |
            target/release/rayzor
            target/release/librayzor_runtime.a
            target/release/examples/benchmark_runner
            target/release/stdlib_snapshot.bin
          retention-days: 1

  benchmark:
    name: bench (${{ matrix.kernel }})
    needs: build
    runs-on: ubuntu-latest
    # One kernel per runner. Run in sequence on a single machine and the heavy
    # kernels leave it warm, so whichever runs last is measured on a throttled
    # CPU. A fresh runner per kernel also keeps one kernel's failure from
    # cancelling the rest of the sweep.
    strategy:
      fail-fast: false
      matrix:
        kernel:
          - nbody
          - fibonacci
          # deltablue disabled: rayzor-gcc hangs (C backend CallIndirect
          # doesn't dereference the closure struct for vtable dispatch).
          # Re-enable after fix.
          - mandelbrot
    steps:
      - uses: actions/checkout@v4

      # --- Install Haxe 4 + HashLink + hxcpp ---
      - name: Install Haxe 4.3.6
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.6

      - name: Install HashLink
        run: |
          # Build the VM only. `make` also builds the optional bindings, and the
          # SDL one now needs SDL3 headers that the runner image does not carry —
          # that is what used to fail here. The benchmarks execute .hl bytecode
          # and load no .hdll, so LIBS= is enough.
          sudo apt-get update
          sudo apt-get install -y libpcre2-dev
          git clone --depth 1 https://github.com/HaxeFoundation/hashlink.git /tmp/hashlink
          cd /tmp/hashlink
          make LIBS= -j"$(nproc)"
          # `make install` copies *.hdll unconditionally and fails when none were
          # built, so place the pieces directly.
          sudo cp hl /usr/local/bin/
          sudo cp libhl.so /usr/local/lib/
          sudo mkdir -p /usr/local/include
          sudo cp src/hl.h src/hl_ffi.h src/hlc.h src/hlc_main.c /usr/local/include/
          sudo ldconfig
          hl --version

      - name: Install hxcpp
        run: |
          haxelib setup ~/haxelib
          haxelib install hxcpp --always

      - name: Install hxjava
        run: |
          haxelib install hxjava

      # The HL/C target is refused by the Haxe compiler without this, even
      # though the generated code needs only HashLink's C headers.
      - name: Install hashlink haxelib
        run: |
          haxelib install hashlink

      - name: Verify Haxe installation
        run: |
          haxe --version
          hl --version || true
          echo "hxcpp installed: $(haxelib path hxcpp 2>/dev/null | head -1)"
          echo "hxjava installed: $(haxelib path hxjava 2>/dev/null | head -1)"
          echo "hashlink installed: $(haxelib path hashlink 2>/dev/null | head -1)"
          # The HL/C target is skipped unless these exist, and a skipped target
          # reads the same as a passing one in the results.
          ls -la /usr/local/include/hlc.h /usr/local/lib/libhl.so

      # --- Install LLVM 21 for Rayzor ---
      - name: Install LLVM 21
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          sudo add-apt-repository -y "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-21 main"
          sudo apt-get update
          sudo apt-get install -y llvm-21 llvm-21-dev libpolly-21-dev

      - name: Download precompiled bundles and stdlib cache
        uses: actions/download-artifact@v4
        with:
          name: precompiled-bundles
          path: .

      - name: Verify downloads
        run: |
          ls -la compiler/benchmarks/precompiled/*.rzb
          ls -la .rayzor/blade/stdlib/stdlib.bsym || echo "No bsym found"

      - name: Download rayzor binaries
        uses: actions/download-artifact@v4
        with:
          name: rayzor-binaries
          path: target/release

      - name: Fix binary permissions
        run: chmod +x target/release/rayzor target/release/examples/benchmark_runner

      # The harness drives the compiler as a library, so it is pointed at the
      # snapshot the CLI embeds. Without this the measured compile lowers the
      # standard library again and reports a figure for a configuration no
      # released binary runs.
      - name: Run ${{ matrix.kernel }} benchmark
        env:
          RAYZOR_SNAPSHOT: target/release/stdlib_snapshot.bin
        run: ./target/release/examples/benchmark_runner ${{ matrix.kernel }} --json --disable-trace

      # Each runner produces only its own kernel; `collect` merges them back
      # into the single results file downstream consumers expect.
      - name: Upload partial results (${{ matrix.kernel }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-partial-${{ matrix.kernel }}
          path: compiler/benchmarks/results/
          retention-days: 90

      - name: Upload partial charts (${{ matrix.kernel }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-charts-${{ matrix.kernel }}
          path: compiler/benchmarks/charts/
          retention-days: 90

  collect:
    name: Collect results
    needs: benchmark
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download rayzor binaries
        uses: actions/download-artifact@v4
        with:
          name: rayzor-binaries
          path: target/release

      - name: Fix binary permissions
        run: chmod +x target/release/examples/benchmark_runner

      - name: Download partial results
        uses: actions/download-artifact@v4
        with:
          pattern: benchmark-partial-*
          path: partials


      # `save_results` merges a kernel into the dated file it finds, but each
      # runner starts from a clean checkout and so writes only its own. Union
      # the `benchmarks` arrays back into one file, keyed by name so a rerun
      # replaces rather than duplicates.
      - name: Merge into one results file
        run: |
          mkdir -p compiler/benchmarks/results compiler/benchmarks/charts
          python3 - <<'EOF'
          import json, pathlib
          merged, date, sysinfo = {}, None, None
          for f in sorted(pathlib.Path('partials').rglob('*.json')):
              d = json.loads(f.read_text())
              date = d.get('date') or date
              sysinfo = d.get('system_info') or sysinfo
              for b in d.get('benchmarks', []):
                  merged[b['name']] = b
          if not merged:
              raise SystemExit('no benchmark results to merge')
          out = {'date': date, 'system_info': sysinfo,
                 'benchmarks': [merged[k] for k in sorted(merged)]}
          p = pathlib.Path('compiler/benchmarks/results') / f'results_{date}.json'
          p.write_text(json.dumps(out, indent=2))
          print(f'merged {len(merged)} kernels -> {p}: {", ".join(sorted(merged))}')
          EOF


      # Every runner writes its own charts/index.html covering only its kernel,
      # so copying the partials just leaves whichever landed last. Redraw from
      # the merged results instead.
      - name: Regenerate charts from merged results
        run: ./target/release/examples/benchmark_runner --charts-only

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: compiler/benchmarks/results/
          retention-days: 90

      - name: Upload benchmark charts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-charts
          path: compiler/benchmarks/charts/
          retention-days: 90
