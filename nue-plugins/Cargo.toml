[package]
name = "nue-plugins"
version = "0.1.0"
edition = "2021"

[lib]
# `cdylib` for the native host plugin loader (rayzor dlopens the
# `.dylib`/`.so`/`.dll` declared via `[build] native-libs`). `rlib`
# is reserved for an eventual wasm static-link path — same shape
# wren_lift's wlift_sqlite uses.
crate-type = ["cdylib", "rlib"]

[dependencies]
# Only the ABI crate. No `rayzor-runtime` dep — the host process
# exports the `rayzor_plugin_*` symbols at link time and our calls
# resolve against them at dlopen via `-Wl,-export_dynamic`. Keeping
# this dep list to one crate prevents host internals (RayzorTensor
# layout, alloc_tensor signature, etc.) from sneaking into plugin
# space and silently breaking on host changes.
rayzor-plugin = { path = "../plugin" }
# default-features=false drops half's `std` feature so the crate links no_std
# on wasm. Native is unaffected — we only use f16's pure bit conversions
# (from_f32/to_bits/from_bits/to_f32), none of which need std.
half = { version = "2", default-features = false }

# wasm-only: the no_std build has no std float methods, so the transcendentals
# in the Q8 kernels (.exp/.abs/.round) route through libm. Native keeps the
# inherent f32 methods (see the `fmath` shim in lib.rs).
[target.'cfg(target_arch = "wasm32")'.dependencies]
libm = "0.2"

# Compiles the CoreML ObjC shim (coreml_shim.m) for the graph engines on
# macOS. Unconditional build-dep on purpose: build.rs references cc::Build
# and must COMPILE on every host even though the shim build is gated at
# runtime on CARGO_CFG_TARGET_OS == macos — a cfg(target_os)-gated build-dep
# is absent on Linux and broke the NUC build with "unresolved crate cc".
[build-dependencies]
cc = "1"
