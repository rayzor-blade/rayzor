[package]
name = "compiler"
version = "0.1.0"
edition = "2021"
description = "Rayzor Haxe Language Compiler"

[dependencies]
parser = { path = "../parser" }
bsym = { path = "bsym" }
source_map = { path = "../source_map" }
diagnostics = { path = "../diagnostics" }
rayzor-runtime = { path = "../runtime", features = ["tcc-runtime"] }
rayzor-runtime-core = { path = "../runtime-core" }
rayzor-plugin = { path = "../plugin" }
# Host-parallel Q8 flash attention (wasm_runner): f16 scale decode + the same
# softmax exp (libm::expf) the wasm guest's fmath uses, for bit-equality.
half = { version = "2", default-features = false }
libm = "0.2"

# Beadie — hot-function promotion broker for tier management.
# Pinned to a git rev rather than crates.io: the batched-compile and
# from_arc constructors we depend on landed in #1 + #2 but haven't
# been released yet. Flip to crates.io once a tagged release goes out.
beadie = { git = "https://github.com/darmie/beadie.git", rev = "1fa5e3bab6b494908e51c0b336e4cc2b5a9cacde", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = "0.8"  # For HDLL dynamic library loading
libc = "0.2"  # For dlopen flags on Linux
postcard = { version = "1.0", features = ["alloc"] }
memmap2 = "0.9"
fxhash = "0.2.1"
smallvec = "1.13"  # Stack-allocated Vec for small collections (FFI args)
log = "0.4"
env_logger = "0.11"
indexmap = "2"
tracing = '0.1.44'
rayon = "1.10"  # Parallel iteration for background JIT compilation
chrono = "0.4"  # Date/time for benchmark results
zstd = "0.13"  # Bundle compression
toml = "0.8"   # Workspace manifest parsing

# Cranelift JIT compilation. Versions are sourced from the
# `darmie/wasmtime` fork (cranelift 0.133.0 series) via the
# `[patch.crates-io]` block in the rayzor workspace root. The
# 0.133 declaration here just lines the resolver up with the patched
# source — the actual code comes from the git checkout.
cranelift = { version = "0.135", features = ["jit", "module", "native"] }
cranelift-module = "0.135"
cranelift-jit = "0.135"
cranelift-codegen = "0.135"
cranelift-frontend = "0.135"
cranelift-native = "0.135"
target-lexicon = "0.12"

# WASM backend — direct MIR → WebAssembly via wasm-encoder
wasm-encoder = "0.245"
wasmparser = "0.245"  # WASM linker — parse runtime .wasm for merging
wit-component = "0.245"  # WASI P2 Component wrapping (core module → component)

# WASM runtime — embedded wasmtime for `rayzor run --wasm`. Pinned to
# bytecodealliance release-46.0.0 (cranelift 0.133) so wasmtime-cranelift
# shares the patched cranelift and the Cranelift JIT compiles in. With
# the old crates.io 43.0.2 (cranelift 0.130) the 0.133 patch made
# wasmtime-cranelift unresolvable → Pulley interpreter → ~50x slowdown.
wasmtime = { git = "https://github.com/bytecodealliance/wasmtime", rev = "60154144", optional = true }
wasi-common = { git = "https://github.com/bytecodealliance/wasmtime", rev = "60154144", package = "wasmtime-wasi", optional = true }

# wgpu-backed Tensor compute for `rayzor run --wasm` (native compute via Metal/Vulkan/DX12)
rayzor-gpu = { path = "../gpu", default-features = false, features = ["webgpu-backend"], optional = true }
pollster = { version = "0.4", optional = true }
wgpu = { version = "24", optional = true }

# LLVM backend (optional, for Tier 3 optimization and AOT).
# LLVM 21.1 (matching the sibling Zyntax toolchain). LLVM 18 / llvm-sys 180 had a
# static-link bug where Target::from_triple failed for every triple despite the
# targets being registered, silently dropping the LLVM tier to a Cranelift fallback.
inkwell = { version = "0.7.1", features = ["llvm21-1"], optional = true}
llvm-sys = { version = "211", optional = true }
regex = "1.12.3"


[build-dependencies]
cc = "1"
bsym = { path = "bsym" }

[dev-dependencies]
walkdir = "2"
criterion = { version = "0.5", features = ["html_reports"] }
clap = { version = "4.5", features = ["derive"] }

[[bench]]
name = "type_system_bench"
harness = false

[[bench]]
name = "macro_bench"
harness = false

[features]
default = ["cranelift-backend", "llvm-backend", "wasm-runtime"]
cranelift-backend = []
llvm-backend = ["inkwell", "llvm-sys"]
# Link LLVM dynamically (libLLVM.so) instead of the static component libs.
# Off by default (M1/homebrew links static). Needed on distros whose apt
# `llvm-<v>-dev` lists `Polly` as a static component but ships no libPolly.a
# (Debian/Ubuntu) — the shared lib bundles Polly, sidestepping the missing .a.
llvm-dynamic = ["llvm-sys/force-dynamic"]
wasm-runtime = ["wasmtime", "wasi-common", "rayzor-gpu", "pollster", "wgpu"]
all-backends = ["cranelift-backend", "llvm-backend"]

[[bin]]
name = "rayzor-build"
path = "src/bin/rayzor_build.rs"
required-features = ["llvm-backend"]

[[bin]]
name = "validate_pipeline"
path = "src/bin/validate_pipeline.rs"

[[bin]]
name = "simple_test"
path = "src/bin/simple_test.rs"

[[bin]]
name = "test_undefined"
path = "src/bin/test_undefined.rs"

[[example]]
name = "test_integration_gaps"
path = "examples/test_integration_gaps.rs"

[[example]]
name = "test_null_safety"
path = "examples/test_null_safety.rs"

[[example]]
name = "test_core_types_e2e"
path = "examples/test_core_types_e2e.rs"

[[example]]
name = "test_std_string_simple"
path = "examples/test_std_string_simple.rs"

[[example]]
name = "test_dynamic_boxing"
path = "examples/test_dynamic_boxing.rs"

[[example]]
name = "test_class_boxing"
path = "examples/test_class_boxing.rs"

[[example]]
name = "test_dynamic_field_access"
path = "examples/test_dynamic_field_access.rs"

[[example]]
name = "benchmark_runner"
path = "examples/benchmark_runner.rs"

[[example]]
name = "benchmark_bundle"
path = "examples/benchmark_bundle.rs"
