[project]
name = "nue"
version = "0.1.0"
# nue is a library — no `entry` since users import it.
type = "library"

[build]
# The Haxe sources live under ./nue/ (matching the Haxe package path).
class-paths = [".", "../rayzor-tensors/haxe"]

[dependencies]
# Shared Tensor/QTensor declarations come from the sibling rayzor-tensors
# source path above; consuming applications load its native plugin.
