[project]
name = "tiny-transformer"
entry = "Main.hx"

[build]
class-paths = [".", "../../", "../../../rayzor-tensors/haxe"]
# nue-plugins delivers extern classes that KVCache transitively
# imports (e.g. KvCacheQ8). The JIT compiles all reachable IR
# including dead branches, so the symbols must resolve even when
# the Q8 path isn't taken at runtime.
native-libs = ["../../../target/release/libnue_plugins.dylib", "../../../target/release/librayzor_tensors.dylib"]

# nue-tuned tier config.
#
# Per direct feedback during 2026-06-02 session: keep start_interpreted=true
# because skipping interpreter for cold-start costs ~80ms (Cranelift bulk
# compile of every function before first execution). Interpreter is the
# faster bootstrap path; first call runs interpreted, threshold=1 promotes
# to Cranelift on the next call.
#
# blazing_threshold = "max" disables count-based LLVM promotion;
# auto_upgrade_to_llvm_after_main_entry triggers a single bulk
# upgrade_to_llvm call after module __init__ returns and before Main.main
# runs, amortising LLVM compile cost over the entire decode loop.
[tier]
interpreter_threshold = 1
warm_threshold = 3
hot_threshold = 10
blazing_threshold = "max"
sample_rate = 1
start_interpreted = true
verbosity = 0
enable_stack_traces = false
auto_upgrade_to_llvm_after_main_entry = true
