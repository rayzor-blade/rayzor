[project]
name = "llama-chat"
entry = "Main.hx"

[build]
class-paths = [".", "../../"]
# Loads nue-plugins (Q8_0 KV cache + flash kernel) at compile time
# via the plugin ABI handshake. Path is relative to this manifest.
native-libs = ["../../../target/release/libnue_plugins.dylib"]

# nue-tuned tier config.
#
# Llama-chat is a monolithic long-running main: compiled direct calls never
# re-enter the dispatcher, so count-based promotion cannot reach the decode
# loop. The effective ladder for this workload is the bulk before-main
# upgrade: Cranelift compiles everything for fast startup + module init,
# then one upgrade_to_llvm installs the LLVM tier before Main.main enters.
#
# enable_tier_promotion=false keeps beadie's background Standard/Optimized
# recompiles out of the run: they compete with the decode loop for cores
# and can present as a streaming hang. With start_interpreted=false all
# functions are compiled up front anyway, so mid-run promotion has nothing
# to add here.
[tier]
interpreter_threshold = 1
warm_threshold = 30
hot_threshold = 5
blazing_threshold = "max"
sample_rate =1
start_interpreted = false
enable_tier_promotion = true
verbosity = 0
enable_stack_traces = false
auto_upgrade_to_llvm_after_main_entry = true
