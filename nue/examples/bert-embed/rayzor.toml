[project]
name = "bert-embed"
entry = "Main.hx"

[build]
# "../../" = nue/ ; "../../../rayzor-tensors/haxe" = rayzor.ds.* Tensor kernels.
class-paths = [".", "../../", "../../../rayzor-tensors/haxe"]
native-libs = ["../../../target/release/librayzor_tensors.dylib", "../../../target/release/libnue_plugins.dylib"]

[tier]
interpreter_threshold = 1
warm_threshold = 30
hot_threshold = 5
blazing_threshold = "max"
sample_rate = 5
start_interpreted = false
enable_tier_promotion = true
verbosity = 0
enable_stack_traces = false
auto_upgrade_to_llvm_after_main_entry = true
