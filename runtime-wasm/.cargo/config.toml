# Enable WASM threads: atomics, bulk-memory, and mutable-globals are required
# for rustc to emit a shared memory section. This is what makes
# `WebAssembly.Memory` back the linear memory with a `SharedArrayBuffer`,
# which lets Atomics.wait/notify + Web Workers run Rayzor threads in
# parallel in the browser.
#
# Target: wasm32-wasip1-threads
#   Same API as wasm32-wasip1 but ships an atomics-enabled wasi-libc
#   sysroot, so `std::fs`, `std::process`, and friends link cleanly with
#   `+atomics` (plain wasm32-wasip1 fails because its prebuilt errno.c
#   wasn't compiled with the atomics feature).

# `runner = wasmtime --wasi=threads-yes` lets `cargo test --target
# wasm32-wasip1-threads` execute the resulting wasm test binary directly.
# Required for the Phase 2 tensor smoke test (matmul_t parity vs scalar
# reference, run inside wasmtime as the WASM parity gate).
[target.wasm32-wasip1-threads]
runner = ["wasmtime", "-S", "threads", "-W", "threads", "-W", "shared-memory"]
rustflags = [
    # +simd128: enables the f32x4/i32x4 lane intrinsics — the existing
    #   `#[cfg(target_feature = "simd128")]` guarded paths in this
    #   crate's SIMD primitives + tensor kernels were dormant without
    #   this. Without it the SIMD demos and tensor primitives silently
    #   fell through to scalar code.
    # +relaxed-simd: enables f32x4.relaxed_madd / nmadd (fused
    #   multiply-add). The wasm32 backend's vector FMA peephole + the
    #   tensor dot/axpy kernels in this crate use them; runtimes that
    #   don't yet support relaxed-simd will reject the module, same
    #   trade-off as basic simd128.
    "-C", "target-feature=+atomics,+bulk-memory,+mutable-globals,+simd128,+relaxed-simd",
    "-C", "link-arg=--shared-memory",
    "-C", "link-arg=--import-memory",
    # 4 GiB (wasm32 cap). A 770 MB GGUF needs to sit in linear memory
    # alongside the runtime-wasm QTensor allocations (each Q6_K weight
    # copies its block buffer), pushing peak usage past the old 1 GiB cap.
    "-C", "link-arg=--max-memory=4294967296",  # 4 GiB
    "-C", "link-arg=--initial-memory=16777216", # 16 MiB
]
