[package]
name = "rayzor-runtime-wasm"
version = "0.1.0"
edition = "2021"
description = "Rayzor runtime for WebAssembly — pure Rust, no platform deps"

[lib]
crate-type = ["cdylib"]

[features]
# Opt-in tracking global allocator: prints net live-heap high-water marks to
# stderr so a long generation's per-token leak is measurable. Zero cost off.
alloc-track = []

[dependencies]
half = "2"
libm = "0.2"  # Pure-Rust math functions (sin, cos, sqrt, etc.) for wasm32
# Shared compute kernels (tensor_simd::tensor_f32, quant::{types, q4_k_m, q6_k,
# q8_k, matmul}). The aarch64-only SDOT module (`quant::sdot`) is `#![cfg]`-gated
# off on wasm32 so we get the scalar / wasm-simd path automatically.
rayzor-runtime-core = { path = "../runtime-core" }

[profile.release]
# opt-level=3 (speed), NOT "s" (size): the quant matmul / tensor kernels
# are compute-bound; size optimization disables loop vectorization,
# unrolling, and aggressive inlining, which made the wasm matmul ~10x
# slower than necessary (pure-compute Haxe→wasm was only ~4x vs native,
# but runtime-wasm Rust at "s" was far worse). Inference speed >> binary
# size here. Flip back to "s" only if a size-constrained deploy needs it.
opt-level = 3
lto = true
strip = true
