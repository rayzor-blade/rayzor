[package]
name = "rayzor-lsp"
version = "0.1.0"
edition = "2024"

[dependencies]
compiler = { path = "../compiler" }
parser = { path = "../parser" }
diagnostics = { path = "../diagnostics" }
source_map = { path = "../source_map" }
lsp-server = "0.7"
lsp-types = "0.97"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1.0", features = ["alloc"] }
log = "0.4"
crossbeam-channel = "0.5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
